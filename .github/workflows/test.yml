# The hub's tests on Linux, run by hand (AGENTS.md, "Before committing"): vet, every
# test, and the race detector on the packages where goroutines meet. swtpm lets
# internal/devkey test the TPM code against a software TPM.
name: Tests

# By hand only (gh workflow run): the organisation's Actions spending is limited.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q swtpm
      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: Tests
        run: go test ./...
      - name: Race detector
        run: go test -race -timeout 40m ./internal/e2e ./internal/live ./internal/tracker ./internal/store
