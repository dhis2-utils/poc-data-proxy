# Builds and checks the hub's Raspberry Pi image (image/README.md). Called by
# release.yml for a release, with the release's own linux/arm64 binary; run by hand
# for a test image, with a binary built here.
name: Pi image

on:
  workflow_call:
    inputs:
      version:
        description: Hub version (without the v)
        required: true
        type: string
      binaries:
        description: Artifact of this run holding hub-linux-arm64 ("" builds one)
        required: false
        type: string
        default: ""
  # By hand, a test image: the version is VERSION as a pre-release of the run
  # (0.1.5-ci.42), so there is nothing to type.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-$(cat VERSION)-ci.$GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: inputs.binaries == ''
        with:
          go-version: '1.26'  # the newest 1.26 patch, not go.mod's 1.26.0 (review R-48)
          check-latest: true
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q e2fsprogs mtools fdisk xz-utils
      - name: The release's hub binary
        if: inputs.binaries != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.binaries }}
          path: bin
      - name: Hub binary
        if: inputs.binaries == ''
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$VERSION -X github.com/dhis2/facility-hub/internal/upgrade.ReleaseKey=$RELEASE_PUBLIC_KEY" \
            -o bin/hub-linux-arm64 ./cmd/hub
      - name: Build the image
        run: sudo image/build.sh bin/hub-linux-arm64 "$VERSION" out
      - name: Check the image
        run: sudo image/check.sh "out/dhis2-hub-$VERSION-arm64.img.xz"
      # Named after the image, with its version: GitHub offers it as a zip of that
      # name (the release fetches it by the same name, in the same run, and publishes
      # it with the release). Kept 3 days: test images filled the artifact storage.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dhis2-hub-${{ env.VERSION }}-arm64.img
          path: out/dhis2-hub-${{ env.VERSION }}-arm64.img.xz
          compression-level: 0
          retention-days: 3
