# A release: the hub binaries, the Pi image and the signed release.json, published as
# the GitHub release v<version> that hubs upgrade from (docs/DEVELOPMENT.md, "Releases and self-upgrade").
# Tags cannot be moved or deleted in this organisation: run this
# workflow by hand (a dry run, nothing published) on the exact commit before tagging.
#
# The release signing key is what every hub trusts before it replaces its own binary
# (review R-08). It is a secret of the GitHub environment "release", which has required
# reviewers; only the publish job of a v* tag push enters that environment and reads it.
# A dry run signs with a throwaway key, even where the real one is set.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry run (nothing is published); empty for VERSION
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the whole history: a tag must be on the default branch
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # VERSION in the repository is the release's version: a tag must match it.
          FILE=$(cat VERSION)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            V="${GITHUB_REF_NAME#v}"
            [ "$V" = "$FILE" ] || { echo "tag v$V does not match VERSION ($FILE)"; exit 1; }
            # Only reviewed code is released: a tag on a branch's commit is refused.
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" ||
              { echo "tag v$V is not on $DEFAULT_BRANCH"; exit 1; }
          else
            V="${INPUT_VERSION:-$FILE}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'  # the newest 1.26 patch, not go.mod's 1.26.0 (review R-48)
          check-latest: true
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          test -n "$RELEASE_PUBLIC_KEY" || { echo "set the repository variable RELEASE_PUBLIC_KEY"; exit 1; }
          FLAGS="-X main.version=$VERSION -X github.com/dhis2/facility-hub/internal/upgrade.ReleaseKey=$RELEASE_PUBLIC_KEY"
          mkdir -p bin
          for p in linux/arm64 linux/amd64 darwin/arm64 darwin/amd64; do
            out=bin/hub-${p%/*}-${p#*/}
            CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath -ldflags "$FLAGS" -o "$out" ./cmd/hub
          done
          go build -o bin/hub-tool ./cmd/hub
      - name: Windows installer (hub.exe signed inside it)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
          # The real certificate for a tagged release only; a dry run signs with the
          # throwaway test certificate, as a CI build does.
          SIGN_CERT_PEM: ${{ github.event_name == 'push' && secrets.SIGN_CERT || '' }}
          SIGN_KEY_PEM: ${{ github.event_name == 'push' && secrets.SIGN_KEY || '' }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis osslsigncode p7zip-full
          if [ -n "$SIGN_CERT_PEM" ] && [ -n "$SIGN_KEY_PEM" ]; then
            D=$(mktemp -d); printf '%s\n' "$SIGN_CERT_PEM" > "$D/cert.pem"; printf '%s\n' "$SIGN_KEY_PEM" > "$D/key.pem"
            export SIGN_CERT=$D/cert.pem SIGN_KEY=$D/key.pem
          fi
          windows/build.sh "$VERSION" bin
          windows/check.sh "bin/dhis2-hub-$VERSION-setup.exe" ${SIGN_CERT:+/etc/ssl/certs/ca-certificates.crt}
          # A tagged release never ships an installer signed with the throwaway test
          # certificate: people would learn to click through Windows' warning (security
          # review S3). Without a real one the release has everything but the installer;
          # sign it elsewhere (windows/README.md) and attach it.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -z "${SIGN_CERT:-}" ]; then
            rm "bin/dhis2-hub-$VERSION-setup.exe"
            echo "No SIGN_CERT/SIGN_KEY secrets: the installer is left out of this release."
          fi
      # Used by the later jobs of the same run; the release publishes the files.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: bin/
          retention-days: 1

  # The Facility Hub app for central, built at the release's version: it matches the
  # hub's account and move codes and signs the instructions hubs act on, so the two
  # are released together.
  app:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/facility-hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, the version from package.json
        with:
          package_json_file: apps/facility-hub/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/facility-hub/pnpm-lock.yaml
      - name: Test and build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test --watchAll=false
          npm pkg set version="$VERSION"
          pnpm build
          mkdir -p ../../app-out
          cp "build/bundle/facility-hub-$VERSION.zip" ../../app-out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app
          path: app-out/
          retention-days: 1

  # The image holds the release's own linux/arm64 binary, the one release.json lists.
  image:
    needs: [version, binaries]
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      binaries: binaries

  publish:
    needs: [version, binaries, image, app]
    runs-on: ubuntu-latest
    # A tag push enters the environment here (waiting for its reviewer, if one is set).
    # A dry run enters no environment ('' is none) and so cannot read it.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dhis2-hub-${{ needs.version.outputs.version }}-arm64.img
          path: img
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app
          path: app
      - name: Sign the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.RELEASE_SIGNING_KEY || '' }}
        run: |
          chmod +x bin/hub-tool
          KEY=$(mktemp); trap 'rm -f "$KEY"' EXIT
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test -n "$RELEASE_SIGNING_KEY" || { echo "set the secret RELEASE_SIGNING_KEY in the environment release"; exit 1; }
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          else
            bin/hub-tool keygen -out "${KEY%.key}" && mv "${KEY%.key}.key" "$KEY"  # dry run: a throwaway key
          fi
          bin/hub-tool release -key "$KEY" -dir out -version "$VERSION" -image "img/dhis2-hub-$VERSION-arm64.img.xz" \
            linux/arm64=bin/hub-linux-arm64 linux/amd64=bin/hub-linux-amd64 windows/amd64=bin/hub-windows-amd64.exe \
            darwin/arm64=bin/hub-darwin-arm64 darwin/amd64=bin/hub-darwin-amd64
          if [ -e "bin/dhis2-hub-$VERSION-setup.exe" ]; then cp "bin/dhis2-hub-$VERSION-setup.exe" out/; fi
          cp "app/facility-hub-$VERSION.zip" out/
          ls -l out
          for f in release.json release.json.sig hub-linux-arm64 hub-linux-amd64 hub-windows-amd64.exe hub-darwin-arm64 hub-darwin-amd64 "dhis2-hub-$VERSION-arm64.img.xz" "facility-hub-$VERSION.zip"; do
            test -s "out/$f" || { echo "missing out/$f"; exit 1; }
          done
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft until every file is attached: hubs upgrade from the published release
        # and must never see it half uploaded.
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
