# The hub on a Mac, as the DHIS2 team runs it to try it (macos/install.sh): the Go
# tests on macOS, then an install from a binary built here, checked (the agent runs,
# answers over HTTPS with its own authority, dhis2.local resolves to it) and removed.
name: macOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests on macOS
        run: go vet ./... && go test $(go list ./... | grep -v /internal/live)

  windows-installer:
    # The Windows installer can be built and signed on a Mac too (windows/README.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools
        run: brew install makensis osslsigncode sevenzip
      - name: Build and check the installer on macOS
        run: |
          windows/build.sh 0.0.0-ci out
          windows/check.sh out/dhis2-hub-0.0.0-ci-setup.exe

  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build -ldflags "-X main.version=0.0.0-ci" -o hub ./cmd/hub
      - name: Install (the runner's sudo needs no password)
        run: macos/install.sh --hub ./hub
      - name: The hub runs and answers over HTTPS, at localhost and dhis2.local
        run: |
          DATA="$HOME/Library/Application Support/DHIS2 Facility Hub"
          cat "$DATA/install.ini"
          PORT=$(sed -n 's/^https_port=//p' "$DATA/install.ini" | tr -d '\r')
          CA_NAME=$(sed -n 's/^ca_name=//p' "$DATA/install.ini" | tr -d '\r')
          ok=""
          for i in $(seq 30); do
            if curl -fsS --cacert "$DATA/ca.crt" "https://localhost:$PORT/hub/status"; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            launchctl print "gui/$(id -u)/org.dhis2.facility-hub" || true
            cat "$DATA/hub.log" "$DATA/launchd.log" 2>/dev/null || true
            exit 1
          fi
          echo
          security find-certificate -c "$CA_NAME" /Library/Keychains/System.keychain >/dev/null
          echo "the authority is in the System keychain"
          # On this Mac, dhis2.local is in /etc/hosts (as on Windows).
          grep 'DHIS2 Facility Hub' /etc/hosts
          curl -fsS --cacert "$DATA/ca.crt" "https://dhis2.local:$PORT/hub/status"
          echo
          # Other devices ask on the network: the hub's own responder must answer them.
          ifconfig | grep 'inet '
          ANS=$(dig @224.0.0.251 -p 5353 +short +tries=3 +time=2 dhis2.local A || true)
          echo "mDNS answer: $ANS"
          if [ -z "$ANS" ]; then
            echo "the hub's mDNS responder did not answer"
            grep -i mdns "$DATA/hub.log" || true
            tail -40 "$DATA/hub.log" || true
            exit 1
          fi
      - name: Uninstall
        run: |
          macos/install.sh --uninstall --remove-data
          if launchctl print "gui/$(id -u)/org.dhis2.facility-hub" >/dev/null 2>&1; then echo "the agent is still loaded"; exit 1; fi
          if [ -e "$HOME/Library/LaunchAgents/org.dhis2.facility-hub.plist" ]; then echo "the agent file is still there"; exit 1; fi
          if grep -q 'DHIS2 Facility Hub' /etc/hosts; then echo "the hosts line is still there"; exit 1; fi
