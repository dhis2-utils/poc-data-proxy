# The hub on Windows (docs/TESTING.md, "Windows"): the Go tests on Windows, then the
# installer built on Linux, installed silently for the whole PC on a Windows runner,
# checked (the service runs and answers over HTTPS with the hub's own authority) and
# uninstalled.
name: Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis osslsigncode p7zip-full
      - name: Build and check the installer
        run: |
          # The next release's version (VERSION), as a pre-release of this run:
          # each run's installer installs over the one before.
          V="$(cat VERSION)-ci.$GITHUB_RUN_NUMBER"
          windows/build.sh "$V" out
          windows/check.sh "out/dhis2-hub-$V-setup.exe"
      # Only the install job of the same run uses it: one push to any branch made one
      # more installer kept 90 days, and they filled the artifact storage.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/dhis2-hub-*-setup.exe
          retention-days: 1

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests on Windows
        shell: bash
        run: go vet ./... && go test $(go list ./... | grep -v /internal/live)

  install:
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Install for the whole PC, silently
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dhis2-hub-*-setup.exe | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S','/AllUsers'
          $data = 'C:\ProgramData\DHIS2 Facility Hub'
          Get-Content "$data\install.ini"
          $svc = Get-Service DHIS2FacilityHub
          # hub.exe must be readable by the service's account (inherited from the folder).
          $acl = icacls "$data\bin\hub.exe" | Out-String
          $acl
          if ($acl -notmatch 'DHIS2FacilityHub') { throw "hub.exe does not grant the service account" }
          for ($i = 0; $i -lt 30 -and $svc.Status -ne 'Running'; $i++) { Start-Sleep 2; $svc.Refresh() }
          if ($svc.Status -ne 'Running') {
            '--- this step: elevated?'
            whoami /groups | Select-String 'Mandatory Label'
            '--- permissions'
            icacls "$data"
            icacls "$data\bin\hub.exe"
            '--- install.log (each command the installer ran, with exit codes)'
            Get-Content "$data\install.log" -ErrorAction SilentlyContinue
            '--- sc qc, sc qsidtype, sc start by hand'
            sc.exe qc DHIS2FacilityHub
            sc.exe qsidtype DHIS2FacilityHub
            sc.exe start DHIS2FacilityHub; "sc start exit code: $LASTEXITCODE"
            Start-Sleep 10
            sc.exe query DHIS2FacilityHub
            '--- service manager events since the install'
            Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, Message
            '--- application errors'
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, ProviderName, Message
            Get-Content "$data\hub.log" -ErrorAction SilentlyContinue
            throw "service: $($svc.Status)"
          }
      - name: The hub answers over HTTPS, trusted through the PC's store
        shell: pwsh
        run: |
          $data = 'C:\ProgramData\DHIS2 Facility Hub'
          $port = ((Get-Content "$data\install.ini") -match '^https_port=') -replace 'https_port=',''
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing "https://localhost:$port/hub/status"; break } catch { Start-Sleep 2 }
          }
          if (-not $r) { Get-Content "$data\hub.log"; throw "no answer on https://localhost:$port" }
          $r.Content
          Resolve-DnsName dhis2.local -ErrorAction SilentlyContinue
          Invoke-WebRequest -UseBasicParsing "https://dhis2.local:$port/hub/status" | Select-Object -ExpandProperty StatusCode
      - name: Uninstall
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\DHIS2 Facility Hub'
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList '/AllUsers','/S',"_?=$dir"
          if (Get-Service DHIS2FacilityHub -ErrorAction SilentlyContinue) { throw "the service is still installed" }
          if (Select-String -Path "$env:windir\System32\drivers\etc\hosts" -Pattern 'DHIS2 Facility Hub' -Quiet) { throw "the hosts line is still there" }
          # Security review S8: the uninstaller rewrites hosts line by line; the other
          # lines must survive intact, each on its own line.
          $hosts = Get-Content "$env:windir\System32\drivers\etc\hosts"
          $hosts.Count
          if ($hosts.Count -lt 2) { throw "the hosts file lost its line breaks" }
          if (-not ($hosts | Select-String -Pattern 'localhost' -Quiet)) { throw "the hosts file lost its other lines" }
