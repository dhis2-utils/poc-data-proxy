# Image defaults (spec 6.1). The same file for every hub in a country; nothing
# facility-specific. Baked into the image at /etc/hub/hub.yaml.
central_url: https://hmis.example.org      # optional; asked at setup if empty
setup_user_group: AbCdEfGhIjK              # user group UID allowed to set up a hub
listen: ":8443"
data_dir: /var/lib/hub
sync_interval: 5m
ping_interval: 15s
pat_expiry_days: 90
release_channel: https://releases.example.org/hub/stable
release_public_key: ""                     # base64 ed25519 key from `hub keygen` (release.pub)

# Optional (defaults shown)
# tls: true                 # self-signed certificate generated at first boot (POC)
# ping_timeout: 5s
# reserved_pool_size: 150   # reserved values kept per generated attribute (spec 10.3)
# full_pull_interval: 24h   # full (non-incremental) pull per user at most this often
# log_requests: false       # log every request and write data_dir/requests.log (spec 13.1)
# session_idle: 1h          # end a hub session after this long without requests
# session_max: 12h          # end a hub session this long after login
# hub_hosts: hub.clinic.example  # extra names clients may use for the hub; the hub refuses other Host headers
