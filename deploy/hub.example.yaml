# An example hub.yaml with every key (spec 6.1); nothing facility-specific. The Pi
# image ships its own /etc/hub/hub.yaml (image/files/etc/hub/hub.yaml), without
# central_url: one image for every country, central's address given at set-up.
central_url: https://hmis.example.org      # the server hubs set up against
# central_hosts: hmis.example.org, *.hmis.example.org  # optional: setup may pick any https URL on these
# With neither central_url nor central_hosts, setup needs the token in data_dir/setup-token (print it on the label).
listen: ":443"                           # https://dhis2.local
http_listen: ":80"                       # http://dhis2.local: the start page and the hub's certificate
data_dir: /var/lib/hub
sync_interval: 15m
# ping_interval: how often the hub probes central while offline; while online it probes
# every four times that (60s at 15s), since only a successful probe costs central a
# TLS handshake
ping_interval: 15s
pat_expiry_days: 90

# Optional (defaults shown)
# tls: true                 # the hub's own certificate authority, made at first boot (docs/DEPLOYMENT.md)
# ping_timeout: 5s
# reserved_pool_size: 500   # default reserved values kept per generated attribute; the Facility Hub app overrides per attribute (facility-hub-config/reserved, where 0 turns an attribute's offline pool off); a pool refills below a quarter of its target
# full_pull_interval: 168h  # full (non-incremental) pull per user at most this often
# ownership_check_interval: 1h  # check that the facility still owns what the hub holds (transfers out)
# access_refresh_interval: 1h   # re-read users' access and the program catalog (logins refresh at once)
# reconnect_delay: 5m       # after an outage, wait a random time up to this before syncing
# log_requests: false       # log every request and write data_dir/requests.log (spec 13.1)
# session_idle: 1h          # end a hub session after this long without requests
# session_max: 12h          # end a hub session this long after login
# key_slot_max_age: 2160h   # remove the key slot of a user who has not logged in for 90 days
# hub_hosts: hub.clinic.example  # extra names clients may use for the hub; the hub refuses other Host headers
# password_fallback: false  # store a sealed central password when a PAT cannot be created (spec 7.1)
usb_dir: /media/hub-usb                 # the box's USB stick: setup code, then the copy a new disk restores from
# uplink_switch: false      # "Simulate uplink cut" on the admin page, for demonstrations only
